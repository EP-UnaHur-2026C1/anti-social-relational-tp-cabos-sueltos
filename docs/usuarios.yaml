tags:
  - name: Usuarios

components:
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          minLength: 3
          maxLength: 50
          example: Pedro
        email:
          type: string
          format: email
          example: pedro@email.com
        createdAt:
          type: string
          format: date-time
          example: "2026-06-03T02:56:04.109Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-03T02:56:04.109Z"

paths:
  /usuarios:
    get:
      summary: Obtener todos los usuarios
      description: Retorna la lista completa de usuarios, sin el campo "password".
      tags:
        - Usuarios
      responses:
        "200":
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
              example:
                - id: 1
                  nickname: pedro
                  email: pedro@email.com
                  createdAt: "2026-06-03T02:56:04.109Z"
                  updatedAt: "2026-06-03T02:56:04.109Z"
                - id: 2
                  nickname: juan
                  email: juan@email.com
                  createdAt: "2026-06-04T03:47:42.015Z"
                  updatedAt: "2026-06-04T03:47:42.015Z"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              example:
                message: Error al obtener los usuarios

/usuarios/{id}:
  get:
    summary: Obtener usuario por ID
    description: Retorna el usuario específico del ID solicitado.
    tags:
      - Usuarios
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID del usuario
        example: 1
    responses:
      "200":
        description: Usuario encontrado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Usuario"
            example:
              - id: 1
                nickname: pedro
                email: pedro@email.com
                createdAt: "2026-06-03T02:56:04.109Z"
                updatedAt: "2026-06-03T02:56:04.109Z"
      "400":
        description: ID no encontrado
        content:
          application/json:
            example:
              message: "El ID del usuario es obligatorio"
      "404":
        description: Usuario no encontrado
        content:
          application/json:
            example:
              message: "Usuario no encontrado"
      "500":
        description: Error interno del servidor
        content:
          application/json:
            example:
              message: Error al validar el usuario
